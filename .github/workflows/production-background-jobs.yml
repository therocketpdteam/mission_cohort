name: Production background jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: production-background-jobs
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process scheduled communications
        env:
          CRON_SECRET: ${{ secrets.PRODUCTION_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://mission-cohort-rocket-pd.vercel.app/api/jobs/send-scheduled-communications?limit=50"
